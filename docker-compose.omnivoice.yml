services:
  omnivoice:
    build:
      context: ./omnivoice
      dockerfile: Dockerfile
    image: polytalk-omnivoice:latest
    container_name: polytalk-omnivoice
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/app/models/cache/huggingface
    volumes:
      - ./omnivoice/models:/app/models
      - ./omnivoice/data:/app/data
    networks:
      - polytalk-network
